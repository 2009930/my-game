<style>

body{margin:0;background:#faf6ef;font-family:system-ui,sans-serif;color:#302a25}

.card{background:#fffdf8;border:1px solid #e4d9ca;border-radius:16px;padding:12px;margin-bottom:10px}

.heart{position:absolute;font-size:26px;animation:rise 1.6s ease-out forwards;pointer-events:none;z-index:20}

.bubble::before{content:'';position:absolute;bottom:-11px;left:50%;margin-left:-8px;border-width:8px 8px 0;border-style:solid;border-color:#e4d9ca transparent transparent;z-index:-1}

function rustle(){try{var AC=window.AudioContext||window.webkitAudioContext;if(!AC)return;if(!window._ac)window._ac=new AC();var ac=window._ac;var dur=0.5,sr=ac.sampleRate,buf=ac.createBuffer(1,Math.floor(sr*dur),sr),data=buf.getChannelData(0),last=0;for(var i=0;i<data.length;i++){var r=Math.random()*2-1;last=last*0.75+r*0.25;var t=i/data.length,env;if(t<0.15)env=t/0.15;else if(t<0.6)env=1;else env=(1-t)/0.4;env*=0.7+0.3*Math.sin(t*Math.PI*4);data[i]=last*env}var src=ac.createBufferSource();src.buffer=buf;var hp=ac.createBiquadFilter();hp.type='highpass';hp.frequency.value=800;var lp=ac.createBiquadFilter();lp.type='lowpass';lp.frequency.value=4500;lp.Q.value=0.3;var g=ac.createGain();g.gain.setValueAtTime(0.06,ac.currentTime);src.connect(hp);hp.connect(lp);lp.connect(g);g.connect(ac.destination);src.start();src.stop(ac.currentTime+dur)}catch(e){}}

function triggerCatAction() {
  var cats = [];
  if(document.getElementById('mainCat')) cats.push({id:'mainCat', pos: mainPos || roomPos});
  if(document.getElementById('v1Cat')) cats.push({id:'v1Cat', pos: v1Pos});
  if(document.getElementById('v2Cat')) cats.push({id:'v2Cat', pos: v2Pos});

  if(cats.length < 2) return;
  var idx1 = Math.floor(Math.random() * cats.length);
  var idx2 = idx1;
  while(idx1 === idx2 && cats.length > 1) { idx2 = Math.floor(Math.random() * cats.length); }
  var pair = [cats[idx1], cats[idx2]];

  var getEmoji = function() {
    var r = Math.random();
    if (r < 0.85) return pick(['😸', '😽', '😺']); 
    if (r < 0.95) return pick(['😾', '😹', '😼']); 
    return pick(['😻', '🙀']); 
  };
  var e1 = getEmoji(); var e2 = getEmoji();
  showBubble(pair[0].id, e1); showBubble(pair[1].id, e2);
  var triggerWords = ['😾', '😹', '😼'];
  if(triggerWords.indexOf(e1) >= 0 || triggerWords.indexOf(e2) >= 0) {
    setTimeout(function(){ triggerJankenGame(pair[0].id, pair[1].id); }, 600);
  }
}

function triggerJankenGame(id1, id2) {
  if(!document.getElementById(id1) || !document.getElementById(id2)) return;
  var hands = ['✌️','✊','🖐️'];
  var p1 = pick(hands), p2 = pick(hands);
  showBubble(id1, p1); showBubble(id2, p2);
  
  var win = false, draw = false, msg = "";
  if(p1 === p2) draw = true;
  else if((p1 === '✌️' && p2 === '🖐️') || (p1 === '✊' && p2 === '✌️') || (p1 === '🖐️' && p2 === '✊')) win = true;

  setTimeout(function() {
    var n1 = (id1 === 'mainCat') ? '主猫' : '访客猫';
    var n2 = (id2 === 'mainCat') ? '主猫' : '访客猫';
    
    if(win) { 
        s.mood = Math.min(100, s.mood + 1); 
        saveData(); jankenWinSnd(); checkStar(); 
        msg = n1 + " (" + p1 + ") 赢了！<br>" + n2 + " (" + p2 + ") 输了<br>💖 心情 +1";
    } else if (draw) { 
        msg = "平局！<br>大家都出了 " + p1; 
    } else { 
        s.mood = Math.max(0, s.mood - 1);
        saveData();
        msg = n2 + " (" + p2 + ") 赢了！<br>" + n1 + " (" + p1 + ") 输了<br>💔 心情 -1"; 
    }
    showPanel('<div style="text-align:center;font-size:40px">✌️✊🖐️</div><h3>猜拳结果</h3><p style="text-align:center;font-size:16px;line-height:1.8">'+msg+'</p><button class="opt" style="text-align:center" onclick="closeM();render()">确定</button>');
  }, 1200);
}

function goto(x){
  if(x==='room')roomPos=null;
  if(x!=='room'){catInBasket=false; stopPurr();}
  scene=x;
  
  v1Name=null; v1Pos=null; v1Watered=false; v1Fed=false;
  v2Name=null; v2Pos=null; v2Watered=false; v2Fed=false;

  if(x==='room'){
    mainPos=null;
    if(Math.random()<0.35){
      var others = Object.keys(CATS).filter(function(n){return n!==s.catName});
      v1Name = pick(others); v1Pos = pick([[18,65],[78,65],[46,80],[74,80]]);
    }
  } else if(x==='yard'){
    mainPos = pick([[20,60], [50,60], [80,60], [25,80], [55,80], [85,80]]);
    var r = Math.random();
    if(r < 0.35) {
      var others = Object.keys(CATS).filter(function(n){return n!==s.catName});
      others = others.sort(function(){return 0.5 - Math.random()});
      v1Name = others[0]; 
      v1Pos = pick([[20,60], [50,60], [80,60], [25,80], [55,80], [85,80]]);
      while(Math.abs(v1Pos[0]-mainPos[0]) < 20 && Math.abs(v1Pos[1]-mainPos[1]) < 15) {
        v1Pos = pick([[20,60], [50,60], [80,60], [25,80], [55,80], [85,80]]);
      }
      
      if(r < 0.15) {
        v2Name = others[1]; 
        v2Pos = pick([[20,60], [50,60], [80,60], [25,80], [55,80], [85,80]]);
        while((Math.abs(v2Pos[0]-mainPos[0]) < 20 && Math.abs(v2Pos[1]-mainPos[1]) < 15) || (Math.abs(v2Pos[0]-v1Pos[0]) < 20 && Math.abs(v2Pos[1]-v1Pos[1]) < 15)) {
          v2Pos = pick([[20,60], [50,60], [80,60], [25,80], [55,80], [85,80]]);
        }
      }
    }
  }

  render();
  if(x==='room'){
    if(Math.random()<0.3){ catInBasket=true; render(); startPurr(); } else { scheduleBasketCheck(); }
  }
}

function startBird(){var wrap=document.getElementById('gameWrap');if(!wrap)return;birdObjs=[];birdScore=0;birdMiss=0;birdStart=performance.now();birdRunning=true;wrap.innerHTML='';var line=document.createElement('div');line.style.cssText='position:absolute;left:0;right:0;bottom:'+BIRD_LINE+'px;height:3px;background:#3b82f6;box-shadow:0 0 8px #3b82f6;';wrap.appendChild(line);for(var i=1;i<3;i++){var sep=document.createElement('div');sep.style.cssText='position:absolute;top:0;bottom:0;left:'+(i*33.33)+'%;width:1px;background:#0001;';wrap.appendChild(sep)}var sc=document.createElement('div');sc.id='birdScore';sc.style.cssText='position:absolute;top:8px;left:12px;font-size:15px;color:#1e40af;font-weight:bold;';sc.textContent='得分：0　失误：0/5';wrap.appendChild(sc);function spawn(){if(!birdRunning)return;var kinds=[['🐦',40],['🐦‍⬛',25],['🕊',20],['🍃',15]],r=Math.random()*100,acc=0,picked='🐦';for(var i=0;i<kinds.length;i++){acc+=kinds[i][1];if(r<acc){picked=kinds[i][0];break}}var lane=Math.floor(Math.random()*3),el=document.createElement('div');el.className='birdLane';el.textContent=picked;el.style.left=(lane*33.33)+'%';el.style.top='-40px';wrap.appendChild(el);birdObjs.push({el:el,lane:lane,y:-40});birdSpawnTimer=setTimeout(spawn,320+Math.random()*450)}spawn();function loop(){if(!birdRunning)return;var elapsed=(performance.now()-birdStart)/1000,speed=70*(1+Math.min(elapsed/25,1)*0.9),lineY=wrap.clientHeight-BIRD_LINE;for(var i=birdObjs.length-1;i>=0;i--){var o=birdObjs[i];o.y+=speed/60;o.el.style.top=o.y+'px';if(o.y>lineY+25){o.el.remove();birdObjs.splice(i,1);birdMiss++;var sc2=document.getElementById('birdScore');if(sc2)sc2.textContent='得分：'+birdScore+'　失误：'+birdMiss+'/5';if(birdMiss>=5){birdRunning=false;if(birdSpawnTimer){clearTimeout(birdSpawnTimer);birdSpawnTimer=null}if(birdLoopId){cancelAnimationFrame(birdLoopId);birdLoopId=null}setTimeout(function(){birdQuit()},250);return}}}birdLoopId=requestAnimationFrame(loop)}loop()}
function birdHit(lane){if(!birdRunning)return;clickSnd();var wrap=document.getElementById('gameWrap');if(!wrap)return;var lineY=wrap.clientHeight-BIRD_LINE,best=null,bestDist=999;for(var i=0;i<birdObjs.length;i++){var o=birdObjs[i];if(o.lane!==lane)continue;var d=Math.abs(o.y-lineY);if(d<bestDist){bestDist=d;best=o}}if(best&&bestDist<62){best.el.style.transition='opacity .25s, transform .25s';best.el.style.opacity='0';best.el.style.transform='scale(1.5)';var el=best.el;setTimeout(function(){el.remove()},280);birdObjs=birdObjs.filter(function(o){return o!==best});birdScore+=10;var sc=document.getElementById('birdScore');if(sc)sc.textContent='得分：'+birdScore+'　失误：'+birdMiss+'/5'}}
function birdQuit(){stopBird();var reward=Math.floor(birdScore/100),moodReward=reward>5?5:reward,coinReward=reward;if(moodReward>0)s.mood=Math.min(100,s.mood+moodReward);if(coinReward>0){s.gold+=coinReward;coinSnd()}saveData();checkStar();render();var endReason=(birdMiss>=5)?'失误 5 次':'手动结束',html='<div style="font-size:40px;text-align:center">🎉</div><h3>音游结束</h3><p style="text-align:center;font-size:12px;color:#806f60">'+endReason+'</p><p style="text-align:center;font-size:18px">得分：'+birdScore+'</p><p style="text-align:center">'+(moodReward>0?'💖+'+moodReward+'　':'')+(coinReward>0?'💰+'+coinReward:'（无奖励）')+'</p><button class="opt" style="text-align:center" onclick="closeM()">好</button>';showPanel(html)}
function stopBird(){birdRunning=false;if(birdSpawnTimer){clearTimeout(birdSpawnTimer);birdSpawnTimer=null}if(birdLoopId){cancelAnimationFrame(birdLoopId);birdLoopId=null}}
function taskMenu(){if(!s.catName){chooseCat();return}checkDay();if(s.mood<60){toast('💖 心情太低啦');return}var singleMark=s.daily.single?'✅ ':'',rewardMark=s.daily.reward?'✅ ':'',html='<h3>📜 任务</h3><p class="hint">职业任务扣 10 心情；事件每天限一次。</p><button class="opt" onclick="closeM();jobEvent()">📞 职业任务（'+s.catName+'｜'+CATS[s.catName].job+'）</button><button class="opt" onclick="closeM();singleEvent()">'+singleMark+'☎️ 单人事件</button><button class="opt" onclick="closeM();rewardEvent()">'+rewardMark+'📞 联机悬赏</button><button class="opt" style="text-align:center;background:#e8ddd0" onclick="closeM()">关闭</button>';showPanel(html)}
function jobEvent(){var ev=pick(JOB[s.catName]);showTask('📞',s.catName+'｜'+CATS[s.catName].job,ev,'job')}
function singleEvent(){checkDay();if(s.daily.single){toast('做过啦');return}var ev=pick(SINGLE);showTask('☎️','单人事件',ev,'single')}
function rewardEvent(){checkDay();if(s.daily.reward){toast('做过啦');return}var ev=pick(REWARD);showTask('📞','联机悬赏',ev,'reward')}
function showTask(icon,title,ev,type){var opts;if(type==='reward'){opts=[[ev[1],ev[2]],[ev[3],ev[4]]]}else{opts=[[ev[1],ev[2]],[ev[3],ev[4]],[ev[5],ev[6]]]}for(var i=opts.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1)),tmp=opts[i];opts[i]=opts[j];opts[j]=tmp}var html='<div style="font-size:40px;text-align:center">'+icon+'</div><h3>'+title+'</h3><p>'+ev[0]+'</p>';for(var k=0;k<opts.length;k++)html+='<button class="opt" onclick="chooseTask(\''+opts[k][1]+'\',\''+type+'\')">'+'ABC'[k]+'：'+opts[k][0]+'</button>';html+='<button class="opt" style="text-align:center;background:#e8ddd0" onclick="closeM()">稍后</button>';showPanel(html)}
function parseVal(v){var sv=String(v);if(sv.indexOf('|')>=0){var p=sv.split('|');return [parseInt(p[0])||0,parseInt(p[1])||0]}return [parseInt(sv)||0,0]}
function chooseTask(v,type){checkDay();if(type==='single')s.daily.single=true;if(type==='reward')s.daily.reward=true;var pv=parseVal(v),moodV=pv[0],goldV=pv[1],decay=(type==='job')?10:0;s.mood=Math.max(0,Math.min(100,s.mood+moodV-decay));var goldGain=goldV;if(type==='job')goldGain+=5;else if(type==='single')goldGain+=3;s.gold=Math.max(0,s.gold+goldGain);if(goldGain>0)coinSnd();saveData();checkStar();closeM();var msg='💖'+moodV;if(decay>0)msg+=' -'+decay;if(goldGain>0)msg+='　💰+'+goldGain;else if(goldGain<0)msg+='　💰'+goldGain;toast(msg);render()}

render();
if(!s.catName)setTimeout(chooseCat,300);
else setTimeout(function(){var F=checkFestival();if(F)showFestival(F);else checkOnline()},900);
</script>
