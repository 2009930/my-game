<style>
*{box-sizing:border-box}
body{margin:0;background:#faf6ef;font-family:system-ui,sans-serif;color:#302a25}
.app{max-width:600px;margin:auto;padding:10px;padding-bottom:110px;position:relative;overflow:hidden}
.card{background:#fffdf8;border:1px solid #e4d9ca;border-radius:16px;padding:12px;margin-bottom:10px}
.scene{position:relative;height:340px;background:#eff6ff;border-radius:12px;overflow:hidden}
.point{position:absolute;cursor:pointer;text-align:center;font-size:42px;line-height:1;user-select:none;-webkit-touch-callout:none;-webkit-user-select:none}
.point small{display:inline-block;font-size:11px;color:#5f544a;margin-top:2px;background:#ffffffcc;border-radius:6px;padding:0 4px}
.cat-img{width:80px;height:80px;object-fit:contain;display:block;margin:0 auto;filter:drop-shadow(0 4px 6px rgba(0,0,0,.15));pointer-events:none;-webkit-touch-callout:none;}
.cat-anim{animation:catIdle 4s ease-in-out infinite}
@keyframes catIdle{0%{transform:translate(0,0) rotate(-2deg)}25%{transform:translate(4px,-4px) rotate(0deg)}50%{transform:translate(0,-7px) rotate(2deg)}75%{transform:translate(-4px,-4px) rotate(0deg)}100%{transform:translate(0,0) rotate(-2deg)}}
.cat-hop{animation:catHop 0.5s ease-out}
@keyframes catHop{0%{transform:translateY(0) scale(1,1)}30%{transform:translateY(-16px) scale(0.95,1.08)}60%{transform:translateY(0) scale(1.05,0.95)}100%{transform:translateY(0) scale(1,1)}}
@keyframes treeShake{0%{transform:rotate(0)}25%{transform:rotate(-10deg)}50%{transform:rotate(8deg)}75%{transform:rotate(-5deg)}100%{transform:rotate(0)}}
.tree-shake{animation:treeShake 0.5s ease-out;display:inline-block}
@keyframes zzzFloat{0%{opacity:0;transform:translateY(0)}15%{opacity:1}40%{opacity:0;transform:translateY(-22px)}100%{opacity:0;transform:translateY(-22px)}}
.zzz{position:absolute;top:-18px;right:-6px;font-size:18px;animation:zzzFloat 4s ease-in-out infinite;pointer-events:none}
.btn{background:#fff;border:1px solid #e4d9ca;border-radius:12px;padding:12px;font-size:14px;cursor:pointer;width:100%;margin-top:8px}
.fbtn{position:fixed;font-size:30px;background:#fff;border:1px solid #e4d9ca;border-radius:50%;width:58px;height:58px;display:grid;place-items:center;box-shadow:0 6px 18px #0002;cursor:pointer;z-index:8;user-select:none}
.fbtn:active{transform:scale(1.08)}
.fbtn small{position:absolute;bottom:-3px;font-size:10px;color:#806f60;background:#fff;border-radius:6px;padding:0 4px}
.modal-bg{position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,0.45);display:none;align-items:center;justify-content:center;padding:12px;z-index:99999;overflow:hidden;backdrop-filter:blur(2px)}
.modal{background:rgba(255,253,248,0.96);border-radius:16px;padding:16px;max-width:520px;width:100%;max-height:88vh;overflow:auto;box-shadow:0 10px 30px rgba(0,0,0,0.2)}
.modal h3{margin:8px 0;font-size:16px;text-align:center}
.modal p{line-height:1.7;margin:10px 0;font-size:14px}
.opt{display:block;width:100%;text-align:left;background:#f3eadf;border:1px solid #e4d9ca;border-radius:12px;padding:12px;margin-top:8px;font-size:14px;cursor:pointer;color:#302a25;font-family:inherit}
.opt:active{background:#eadbc4}
.opt:disabled{opacity:.5;cursor:not-allowed}
.item{display:flex;justify-content:space-between;align-items:center;background:#fff;border:1px solid #e4d9ca;border-radius:12px;padding:10px 12px;margin-top:8px;gap:8px}
.item .info{flex:1;min-width:0}

.item button:disabled{opacity:.45}
.hint{font-size:12px;color:#806f60;line-height:1.6;margin:6px 0}
.heart{position:absolute;font-size:26px;animation:rise 1.6s ease-out forwards;pointer-events:none;z-index:99999}
@keyframes rise{0%{opacity:0;transform:translateY(0)}20%{opacity:1}100%{opacity:0;transform:translateY(-80px)}}
.toast{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);background:#000a;color:#fff;padding:12px 20px;border-radius:14px;z-index:999999;pointer-events:none;text-align:center;max-width:80vw}
.birdLane{position:absolute;font-size:34px;width:33.33%;text-align:center;pointer-events:none}
#errbox{position:fixed;top:0;left:0;right:0;background:#c00;color:#fff;padding:8px;font-size:12px;z-index:9999999;word-break:break-all;display:none}
.bubble{position:absolute;background:#fff;border:2px solid #e4d9ca;border-radius:12px;padding:6px 10px;font-size:24px;top:-45px;left:50%;transform:translateX(-50%);white-space:nowrap;z-index:100;box-shadow:0 4px 8px rgba(0,0,0,0.1);animation:popIn 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275)}
.bubble::after{content:'';position:absolute;bottom:-8px;left:50%;margin-left:-8px;border-width:8px 8px 0;border-style:solid;border-color:#fff transparent transparent}
.bubble::before{content:'';position:absolute;bottom:-11px;left:50%;margin-left:-8px;border-width:8px 8px 0;border-style:solid;border-color:#e4d9ca transparent transparent;z-index:-1}
@keyframes popIn{0%{transform:translateX(-50%) scale(0)}100%{transform:translateX(-50%) scale(1)}}
.wx{position:absolute;left:0;top:0;right:0;bottom:0;pointer-events:none;overflow:hidden}
.wx-drop{position:absolute;top:-16px;width:2px;height:14px;border-radius:2px;background:linear-gradient(#9cc7ff,#e8f3ff);opacity:.7;animation:wxFall linear infinite}
@keyframes wxFall{0%{transform:translateY(0)}100%{transform:translateY(370px)}}
.wx-flake{position:absolute;top:-18px;font-size:13px;opacity:.85;animation:wxFlake linear infinite}
@keyframes wxFlake{0%{transform:translateY(0) rotate(0deg)}100%{transform:translateY(370px) rotate(200deg)}}
.wx-leaf{position:absolute;top:-18px;font-size:14px;opacity:.75;animation:wxLeaf linear infinite}
@keyframes wxLeaf{0%{transform:translate(0,0) rotate(0)}50%{transform:translate(16px,180px) rotate(140deg)}100%{transform:translate(0,370px) rotate(300deg)}}
.cat-held{filter:drop-shadow(0 14px 16px rgba(0,0,0,.32));transform:scale(1.06);cursor:grabbing}

@keyframes wxFlash{0%,86%,100%{opacity:0}88%{opacity:.55}90%{opacity:.05}92%{opacity:.4}94%{opacity:0}}

<script>
window.onerror=function(m,u,l){var b=document.getElementById('errbox');if(b){b.style.display='block';b.textContent='❌ '+m+' | 第'+l+'行'}};

// ======== 音效系统 ========
var audioCtx=null,purrTimer=null,purrActive=false;
function initAudio(){if(!audioCtx){var AC=window.AudioContext||window.webkitAudioContext;if(AC)audioCtx=new AC()}if(audioCtx&&audioCtx.state==='suspended')audioCtx.resume()}
function clickSnd(){try{initAudio();if(!audioCtx)return;var osc=audioCtx.createOscillator(),gain=audioCtx.createGain();osc.type='sine';var t=audioCtx.currentTime;osc.frequency.setValueAtTime(600,t);gain.gain.setValueAtTime(0.05,t);gain.gain.exponentialRampToValueAtTime(0.001,t+0.1);osc.connect(gain);gain.connect(audioCtx.destination);osc.start(t);osc.stop(t+0.1)}catch(e){}}
var PURR_VOL=0.0005;  // 呼噜响度：几乎是看不见的底噪
var MEOW={
  芝麻:{f0:950, f1:1500, f2:880, dur:0.30, vol:0.11,  cut:3400},   // 亮、响、短
  糯米:{f0:820, f1:1280, f2:760, dur:0.44, vol:0.095, cut:2750},   // 低、暖、长
  小咪:{f0:1100, f1:1500, f2:1000, dur:0.32, vol:0.04,  cut:4800}  // 又尖又小
};
function singMeow(cfg, t, scale, pitch, volScale){
  var dur=cfg.dur*scale;
  var vol=cfg.vol*(volScale===undefined?1:volScale);
  var osc=audioCtx.createOscillator(), gain=audioCtx.createGain(), lp=audioCtx.createBiquadFilter();
  osc.type='sine';
  osc.frequency.setValueAtTime(cfg.f0*pitch,t);
  osc.frequency.linearRampToValueAtTime(cfg.f1*pitch,t+0.1*scale);
  osc.frequency.exponentialRampToValueAtTime(cfg.f2*pitch,t+dur*0.85);
  lp.type='lowpass'; lp.frequency.value=cfg.cut;
  gain.gain.setValueAtTime(0,t);
  gain.gain.linearRampToValueAtTime(vol,t+0.035);
  gain.gain.exponentialRampToValueAtTime(0.0006,t+dur*1.05);
  osc.connect(lp); lp.connect(gain); gain.connect(audioCtx.destination);
  osc.start(t); osc.stop(t+dur+0.02);
}
function meowSnd(who){
  try{
    initAudio(); if(!audioCtx) return;
    var cfg=MEOW[who]||MEOW['糯米'];
    var t=audioCtx.currentTime;
    singMeow(cfg,t,1,1);
    if(who==='小咪') singMeow(cfg,t+0.24,0.85,1.05,0.4);   // 小猫连叫两声，第二声更轻
  }catch(e){}
}
function purrSnd(){try{initAudio();if(!audioCtx)return;var t=audioCtx.currentTime;var osc=audioCtx.createOscillator(),gain=audioCtx.createGain(),lfo=audioCtx.createOscillator(),lfoGain=audioCtx.createGain();osc.type='sawtooth';osc.frequency.value=40;lfo.type='sine';lfo.frequency.value=25;lfoGain.gain.value=0.05;gain.gain.setValueAtTime(0,t);gain.gain.linearRampToValueAtTime(PURR_VOL,t+0.2);gain.gain.setValueAtTime(PURR_VOL*0.93,t+0.8);gain.gain.exponentialRampToValueAtTime(0.001,t+1.5);var filter=audioCtx.createBiquadFilter();filter.type='lowpass';filter.frequency.value=140;lfo.connect(lfoGain);lfoGain.connect(gain.gain);osc.connect(filter);filter.connect(gain);gain.connect(audioCtx.destination);osc.start(t);lfo.start(t);osc.stop(t+1.5);lfo.stop(t+1.5)}catch(e){}}
function startPurr(){
  stopPurr();
  purrActive=true;
  purrCycle();
}
// 一轮：要么这一轮干脆不打，要么连着打 1~3 声，然后安静一阵再来
function purrCycle(){
  if(!purrActive) return;
  if(Math.random()<0.3){                       // 有时候这一轮就是不打
    purrTimer=setTimeout(purrCycle, 5000+Math.random()*7000);
    return;
  }
  var bursts=4+Math.floor(Math.random()*5);    // 4~8 声，连着打 7~14 秒
  var i=0;
  (function one(){
    if(!purrActive) return;
    purrSnd();
    i++;
    if(i<bursts) purrTimer=setTimeout(one, 1500+Math.random()*500);
    else purrTimer=setTimeout(purrCycle, 4000+Math.random()*7000);
  })();
}
function stopPurr(){
  purrActive=false;
  if(purrTimer){ clearTimeout(purrTimer); purrTimer=null; }
}
function jankenWinSnd(){try{initAudio();if(!audioCtx)return;var t=audioCtx.currentTime;[523.25,659.25,783.99,1046.50].forEach(function(freq,i){var osc=audioCtx.createOscillator(),gain=audioCtx.createGain();osc.type='sine';osc.frequency.value=freq;gain.gain.setValueAtTime(0,t+i*0.1);gain.gain.linearRampToValueAtTime(0.06,t+i*0.1+0.05);gain.gain.exponentialRampToValueAtTime(0.001,t+i*0.1+0.3);osc.connect(gain);gain.connect(audioCtx.destination);osc.start(t+i*0.1);osc.stop(t+i*0.1+0.3)})}catch(e){}}
function coinSnd(){try{initAudio();if(!audioCtx)return;var osc=audioCtx.createOscillator(),gain=audioCtx.createGain();osc.type='square';var t=audioCtx.currentTime;osc.frequency.setValueAtTime(987.77,t);osc.frequency.setValueAtTime(1318.51,t+0.08);gain.gain.setValueAtTime(0.05,t);gain.gain.exponentialRampToValueAtTime(0.001,t+0.3);osc.connect(gain);gain.connect(audioCtx.destination);osc.start(t);osc.stop(t+0.3)}catch(e){}}
// 鸟类叫声：每种鸟音高/节奏不同（🐦 麻雀亮、🐦‍⬛ 乌鸫厚、🕊 咕咕低、🍃 只有叶子响）
function birdCfg(kind){
  if(kind==='🐦‍⬛') return {base:1450,notes:2,step:0.13,dur:0.1,type:'triangle',vol:0.034,up:1.12};
  if(kind==='🕊')     return {base:580,notes:2,step:0.24,dur:0.2,type:'sine',vol:0.03,up:1.05};
  if(kind==='🍃')     return null;
  return {base:2500,notes:3,step:0.085,dur:0.07,type:'sine',vol:0.035,up:1.38};
}
function birdChirp(kind){
  try{
    initAudio(); if(!audioCtx) return;
    var cfg=birdCfg(kind);
    if(!cfg){ leafRustle(); return; }
    var t0=audioCtx.currentTime, detune=0.95+Math.random()*0.1;
    for(var i=0;i<cfg.notes;i++){
      var t=t0+i*cfg.step;
      var osc=audioCtx.createOscillator(), g=audioCtx.createGain();
      osc.type=cfg.type;
      var f=cfg.base*detune*(i%2?0.93:1);
      osc.frequency.setValueAtTime(f,t);
      osc.frequency.exponentialRampToValueAtTime(f*cfg.up,t+cfg.dur*0.72);
      g.gain.setValueAtTime(0,t);
      g.gain.linearRampToValueAtTime(cfg.vol,t+0.012);
      g.gain.exponentialRampToValueAtTime(0.0008,t+cfg.dur);
      osc.connect(g); g.connect(audioCtx.destination);
      osc.start(t); osc.stop(t+cfg.dur+0.02);
    }
  }catch(e){}
}
function leafRustle(){
  try{
    initAudio(); if(!audioCtx) return;
    var ac=audioCtx, dur=0.16, sr=ac.sampleRate;
    var buf=ac.createBuffer(1,Math.floor(sr*dur),sr), d=buf.getChannelData(0), last=0;
    for(var i=0;i<d.length;i++){ var r=Math.random()*2-1; last=last*0.6+r*0.4; var tt=i/d.length; d[i]=last*(tt<0.1?tt/0.1:(1-tt)*1.2)*0.5; }
    var src=ac.createBufferSource(); src.buffer=buf;
    var hp=ac.createBiquadFilter(); hp.type='highpass'; hp.frequency.value=1800;
    var g=ac.createGain(); g.gain.value=0.03;
    src.connect(hp); hp.connect(g); g.connect(ac.destination); src.start();
  }catch(e){}
}

  小咪:{img:'https://img.remit.ee/i/ecP6N2gZlAUJ',job:'程序员',heart:'💚',petTexts:['💕 小咪慢悠悠蹭了蹭你的腿','💕 小咪舔了舔你的手','💕 小咪打了个小哈欠'],like:['猫薄荷茶','无盐奶酪','羊奶冻干片'],dislike:['小块蒸红薯','小颗蒸玉米']}
};

var FURN_SHOP=[['indoorPlant','🪴','猫咪友好植物','屋内',40],['fountain','⛲','喷泉','院子',120],['ladder','🪵','攀爬木杆','院子',80],['rock','🪨','景观岩石','院子',60],['slide','🛝','滑梯','院子',150]];

function foodIcon(name){

  if(!name) return;

// 拿不到真实天气时，按日期推算出稳定的一天天气（同一天不会变）
function localWeatherKey(){
  var d=new Date(), m=d.getMonth()+1;
  var seed=d.getFullYear()*372+m*31+d.getDate();
  var x=Math.abs(Math.sin(seed*12.9898)*43758.5453)%1;
  var table;
  if(m<=2||m===12) table=[['sunny',28],['cloudy',20],['overcast',16],['snow',18],['rain',12],['fog',6]];
  else if(m>=6&&m<=8) table=[['sunny',38],['cloudy',26],['rain',20],['storm',11],['wind',5]];
  else table=[['sunny',30],['cloudy',30],['overcast',14],['rain',20],['fog',6]];
  var total=0; for(var i=0;i<table.length;i++) total+=table[i][1];
  var r=x*total, acc=0;
  for(var j=0;j<table.length;j++){ acc+=table[j][1]; if(r<acc) return table[j][0]; }
  return 'sunny';
}
function mapWmo(c){
  if(typeof c!=='number') return null;
  if(c===0) return 'sunny';
  if(c===1||c===2) return 'cloudy';
  if(c===3) return 'overcast';
  if(c===45||c===48) return 'fog';
  if(c>=51&&c<=57) return 'rain';
  if(c>=61&&c<=67) return 'rain';
  if(c>=71&&c<=77) return 'snow';
  if(c>=80&&c<=82) return 'rain';
  if(c===85||c===86) return 'snow';
  if(c>=95) return 'storm';
  return 'cloudy';
}

var wanderTimer=null, wanderSegTimers=[];

function stopWander(){ if(wanderTimer){ clearTimeout(wanderTimer); wanderTimer=null; } for(var i=0;i<wanderSegTimers.length;i++) clearTimeout(wanderSegTimers[i]); wanderSegTimers=[]; }

function startWander(){
  if(wanderTimer) return;
  if(scene!=='room' && scene!=='yard') return;
  if(!s.catName) return;
  if(!catIdsPresent().length) return;          // 猫在篮子里睡觉时不用空转
  wanderTimer=setTimeout(wanderTick, 12000+Math.random()*8000);
}


function walkWithRhythm(el,pos,target){
  var d1=3.0+Math.random()*1.0, pause=0.5+Math.random()*0.6, d2=2.4+Math.random()*1.0;
  var mx=pos[0]+(target.x-pos[0])*0.55, my=pos[1]+(target.y-pos[1])*0.5;
  el.style.transition='left '+d1.toFixed(1)+'s cubic-bezier(.42,0,.58,1), top '+d1.toFixed(1)+'s cubic-bezier(.42,0,.58,1)';
  el.style.left=mx+'%'; el.style.top=my+'%';
  el.style.zIndex=catZ(target.y);
  pos[0]=target.x; pos[1]=target.y;
  wanderSegTimers.push(setTimeout(function(){
    if(!el || !el.style) return;
    el.style.transition='left '+d2.toFixed(1)+'s cubic-bezier(.45,0,.55,1), top '+d2.toFixed(1)+'s cubic-bezier(.45,0,.55,1)';
    el.style.left=target.x+'%'; el.style.top=target.y+'%';
  }, (d1+pause)*1000));
}
function wanderTick(){
  wanderTimer=null;
  if(scene!=='room' && scene!=='yard') return;
  if(document.getElementById('overlay').style.display==='flex'){ startWander(); return; }
  if(isJankening || walkingToBasket){ startWander(); return; }

  var kind=scene;
  var rows=(kind==='room')?ROOM_ROWS:YARD_ROWS;
  var cats=[];
  var mainRef=(kind==='room')?roomPos:mainPos;
  if(!catInBasket && mainRef) cats.push({id:'mainCat', pos:mainRef});
  if(v1Pos) cats.push({id:'v1Cat', pos:v1Pos});
  if(v2Pos) cats.push({id:'v2Cat', pos:v2Pos});

  for(var i=0;i<cats.length;i++){
    var c=cats[i];
    if(Math.random()<0.3) continue;                 // 有时候只是待着不动
    var el=document.getElementById(c.id);
    if(!el) continue;

    var row=rows[0];
    for(var r=0;r<rows.length;r++){ if(Math.abs(rows[r].y-c.pos[1])<6){ row=rows[r]; break; } }
    var cur=row.xs[0];
    for(var k=0;k<row.xs.length;k++){ if(Math.abs(row.xs[k]-c.pos[0])<Math.abs(cur-c.pos[0])) cur=row.xs[k]; }
    var curI=row.xs.indexOf(cur);
    var cands=[];
    for(var s=-1;s<=1;s++){
      if(s===0) continue;
      var idx=curI+s;
      if(idx<0||idx>=row.xs.length) continue;
      cands.push({x:row.xs[idx], y:row.y});
    }
    // 不要挪到别的猫身上
    var free=[];
    for(var m=0;m<cands.length;m++){
      var okSpot=true;
      for(var o=0;o<cats.length;o++){
        if(cats[o]===c) continue;
        if(Math.abs(cats[o].pos[0]-cands[m].x)<16 && Math.abs(cats[o].pos[1]-cands[m].y)<12){ okSpot=false; break; }
      }
      if(okSpot) free.push(cands[m]);
    }
    if(!free.length) continue;

    var t=pick(free);
    walkWithRhythm(el, c.pos, t);
  }
  startWander();
}

// 猫咪身边有没有已购买的家具（百分比坐标体系）
function nearFurniture(x,y){
  var list=[];
  if(scene==='room'){
    if(s.furniture.indoorPlant) list.push({key:'indoorPlant', x:32, y:74});
  } else if(scene==='yard'){
    if(s.furniture.ladder) list.push({key:'ladder', x:20, y:48});
    if(s.furniture.rock) list.push({key:'rock', x:30, y:78});
    if(s.furniture.fountain) list.push({key:'fountain', x:66, y:78});
    if(s.furniture.slide) list.push({key:'slide', x:82, y:48});
  }
  var best=null, bestD=1e9;
  for(var i=0;i<list.length;i++){
    var f=list[i], dx=Math.abs(f.x-x), dy=Math.abs(f.y-y);
    if(dx<=15 && dy<=18 && (dx+dy)<bestD){ best=f; bestD=dx+dy; }
  }
  return best;
}

function catPosRef(id){
  if(id==='mainCat') return (scene==='room')?roomPos:mainPos;
  if(id==='v1Cat') return v1Pos;
  if(id==='v2Cat') return v2Pos;
  return null;
}
// 需要多远的中心距：保证两只猫不重叠、头顶气泡也不叠在一起
function needGapPct(){
  var box=document.getElementById('sceneBox');
  var w=(box && box.clientWidth) || 580;
  var need=(132/w)*100;
  if(need<16) need=16;
  if(need>34) need=34;
  return need;
}
// 把 A 挪到 B 旁边（同一行），返回过渡时长(ms)，挪不动返回 0
// 目标距离是一个“舒适区间”：够近能说话，又不会近到气泡叠在一起
function approachForTalk(idA,posA,idB,posB){
  var rows=(scene==='room')?ROOM_ROWS:YARD_ROWS;
  var need=needGapPct(), maxGap=need+8;
  var row=rows[0];
  for(var r=0;r<rows.length;r++){ if(Math.abs(rows[r].y-posB[1])<6){ row=rows[r]; break; } }
  function pickSlot(lo,hi){
    var best=null,bestD=1e9;
    for(var i=0;i<row.xs.length;i++){
      var x=row.xs[i], d=Math.abs(x-posB[0]);
      if(d<lo||d>hi) continue;
      var dist=Math.abs(x-posA[0]);
      if(dist<bestD){ bestD=dist; best={x:x, y:row.y}; }
    }
    return best;
  }
  var best=pickSlot(need,maxGap) || pickSlot(need,999);
  if(!best) return 0;
  var el=document.getElementById(idA); if(!el) return 0;
  var dur=(2.4+Math.random()*0.8).toFixed(1);
  el.style.transition='left '+dur+'s ease-in-out, top '+dur+'s ease-in-out';
  el.style.left=best.x+'%'; el.style.top=best.y+'%'; el.style.zIndex=catZ(best.y);
  posA[0]=best.x; posA[1]=best.y;
  return dur*1000;
}
function startJanken(id1,id2){
  if(!document.getElementById(id1) || !document.getElementById(id2)){ isJankening=false; startInteractionTimer(true); return; }
  var p1=catPosRef(id1), p2=catPosRef(id2);
  if(!p1 || !p2){ triggerJankenGame(id1,id2); return; }
  var need=needGapPct(), maxGap=need+8;
  var gap=Math.abs(p1[0]-p2[0]);
  var sameRow=Math.abs(p1[1]-p2[1])<1;
  if(sameRow && gap>=need && gap<=maxGap){ triggerJankenGame(id1,id2); return; }
  var ms=approachForTalk(id1,p1,id2,p2) || approachForTalk(id2,p2,id1,p1);
  addCatTimer(function(){
    if(!isJankening) return;
    triggerJankenGame(id1,id2);
  }, ms ? (ms+300) : 700);
}

function scenePct(e){
  var box=document.getElementById('sceneBox'); if(!box) return null;
  var r=box.getBoundingClientRect(); if(!r||!r.width||!r.height) return null;
  var x=(e.clientX-r.left)/r.width*100, y=(e.clientY-r.top)/r.height*100;
  if(isNaN(x)||isNaN(y)) return null;
  return [x,y];
}
function catGrabStart(e,id){
  if(scene!=='room' && scene!=='yard') return;
  var pos=catPosRef(id); if(!pos) return;

  grabState={id:id, x0:(e&&e.clientX)||0, y0:(e&&e.clientY)||0, active:false, pos:pos, el:el};
  if(grabTimer) clearTimeout(grabTimer);
  grabTimer=setTimeout(function(){
    if(!grabState || grabState.active) return;
    grabState.active=true;
    isLongPress=true;                 // 让随后的 click 不再算「摸一下」
    grabState.el.style.transition='none';
    grabState.el.style.zIndex=400;

}
function catGrabMove(e){
  if(!grabState) return;
  var dx=((e&&e.clientX)||0)-grabState.x0, dy=((e&&e.clientY)||0)-grabState.y0;
  if(!grabState.active){
    if(Math.abs(dx)>10 || Math.abs(dy)>10){ if(grabTimer){clearTimeout(grabTimer);grabTimer=null;} grabState=null; }
    return;
  }
  var p=scenePct(e), b=dropBand(); if(!p||!b) return;
  var x=Math.max(b.x0, Math.min(b.x1, p[0]));
  var y=Math.max(b.y0, Math.min(b.y1, p[1]));
  grabState.el.style.left=x+'%';
  grabState.el.style.top=y+'%';
  grabState.pos[0]=x; grabState.pos[1]=y;
}
function catGrabEnd(e){
  if(grabTimer){ clearTimeout(grabTimer); grabTimer=null; }
  if(!grabState) return;
  var st=grabState; grabState=null;
  if(st.el) st.el.classList.remove('cat-held');
  if(!st.active) return;
  justGrabbed=true;
  placeCat(st);
}
function nearestRowY(kind,y){
  var rows=(kind==='room')?ROOM_ROWS:YARD_ROWS;
  var best=rows[0].y;
  for(var i=0;i<rows.length;i++) if(Math.abs(rows[i].y-y)<Math.abs(best-y)) best=rows[i].y;
  return best;
}
function snapXToRow(kind,y,x){
  var rows=(kind==='room')?ROOM_ROWS:YARD_ROWS;
  var row=rows[0];
  for(var i=0;i<rows.length;i++) if(rows[i].y===y) row=rows[i];
  var best=row.xs[0];
  for(var j=0;j<row.xs.length;j++) if(Math.abs(row.xs[j]-x)<Math.abs(best-x)) best=row.xs[j];
  return best;
}
function placeCat(st){
  var kind=scene, b=dropBand(); if(!b) return;
  var y=nearestRowY(kind, st.pos[1]);
  var x=snapXToRow(kind, y, st.pos[0]);
  st.pos[0]=x; st.pos[1]=y;

  var bk=basketPos();
  if(!catInBasket && Math.abs(bk[0]-x)<=10 && Math.abs(bk[1]-y)<=14){
    catInBasket=true; render(); startPurr();
    toast('💤 你把它放进篮子，它蜷起来就睡了');
    return;
  }
  render();
  var furn=nearFurniture(x,y);
  if(furn && FURN_PLAY[furn.key] && FURN_PLAY[furn.key][s.catName]){
    var line=pick(FURN_PLAY[furn.key][s.catName]);

function initWeather(){
  var d=today();
  if(s.weather && s.weather.day===d && WEATHER_TYPES[s.weather.key]){
    wxNow=s.weather.key;
    return;
  }

function scheduleWeatherFetch(){
  if(s.wxDenied) return;
  if(window._wxTimer) clearTimeout(window._wxTimer);
  window._wxTimer=setTimeout(function(){
    tryWeatherApi(function(key){
      if(!key) return;
      wxNow=key;
      s.weather={day:today(),key:key,src:'api'};
      saveData();
      render();
    });
  }, 2500);
}
function tryWeatherApi(cb){
  try{
    if(!navigator.geolocation || !window.fetch) return;
    var done=false;
    var guard=setTimeout(function(){ if(!done){ done=true; cb(null); } },8000);
    navigator.geolocation.getCurrentPosition(function(pos){
      if(done) return; done=true; clearTimeout(guard);
      var lat=pos.coords.latitude.toFixed(3), lon=pos.coords.longitude.toFixed(3);
      fetch('https://api.open-meteo.com/v1/forecast?latitude='+lat+'&longitude='+lon+'&current_weather=true')
        .then(function(r){ return r.json() })
        .then(function(j){ cb(mapWmo(j && j.current_weather && j.current_weather.weathercode) || null) })
        .catch(function(){ cb(null) });
    }, function(){
      if(done) return; done=true; clearTimeout(guard);
      s.wxDenied=true; saveData(); cb(null);
    }, {timeout:6000, maximumAge:600000, enableHighAccuracy:false});
  }catch(e){}
}

var bikePos=null, skatePos=null, rideKind=null;
var rideTimers=[];
function clearRideTimers(){ for(var i=0;i<rideTimers.length;i++) clearTimeout(rideTimers[i]); rideTimers=[]; }
function rollRidePositions(){
  var pool=[];
  for(var x=12;x<=84;x+=4) for(var y=54;y<=80;y+=6) pool.push([x,y]);
  bikePos=pick(pool);
  var far=[];
  for(var i=0;i<pool.length;i++){
    var p=pool[i];
    if(Math.abs(p[0]-bikePos[0])>=24 || Math.abs(p[1]-bikePos[1])>=18) far.push(p);
  }
  skatePos=far.length?pick(far):pick(pool);
}
function rideEl(kind){
  var bike=(kind==='bike');
  var p=bike?bikePos:skatePos;
  if(!p) return '';
  var used=bike?s.daily.bike:s.daily.skate;
  return '<div class="point" style="left:'+p[0]+'%;top:'+p[1]+'%;font-size:'+(bike?34:30)+'px;z-index:3;'+(used?'opacity:.45':'')+'" onclick="rideStart(\''+kind+'\')">'+(bike?'🚲':'🛴')+'<small>'+(bike?'自行车':'滑板')+'</small></div>';
}
function bikeBellSnd(){
  try{
    initAudio(); if(!audioCtx) return;
    var t=audioCtx.currentTime;
    [0,0.16].forEach(function(dt){
      var o=audioCtx.createOscillator(), g=audioCtx.createGain();
      o.type='triangle';
      o.frequency.setValueAtTime(2100,t+dt);
      o.frequency.exponentialRampToValueAtTime(1650,t+dt+0.12);
      g.gain.setValueAtTime(0,t+dt);
      g.gain.linearRampToValueAtTime(0.07,t+dt+0.01);
      g.gain.exponentialRampToValueAtTime(0.0008,t+dt+0.22);
      o.connect(g); g.connect(audioCtx.destination); o.start(t+dt); o.stop(t+dt+0.25);
    });
  }catch(e){}
}
function skateSnd(){
  try{
    initAudio(); if(!audioCtx) return;
    var ac=audioCtx, dur=0.5, sr=ac.sampleRate;
    var buf=ac.createBuffer(1,Math.floor(sr*dur),sr), d=buf.getChannelData(0), last=0;
    for(var i=0;i<d.length;i++){
      var r=Math.random()*2-1; last=last*0.5+r*0.5;
      var tt=i/d.length; d[i]=last*(tt<0.08?tt/0.08:Math.max(0,(1-tt)*1.4));
    }
    var src=ac.createBufferSource(); src.buffer=buf;
    var bp=ac.createBiquadFilter(); bp.type='bandpass'; bp.frequency.value=900; bp.Q.value=0.8;
    var g=ac.createGain(); g.gain.value=0.05;
    src.connect(bp); bp.connect(g); g.connect(ac.destination); src.start();
    var t2=ac.currentTime+0.46;
    var o=ac.createOscillator(), g2=ac.createGain();
    o.type='sine'; o.frequency.setValueAtTime(120,t2);
    g2.gain.setValueAtTime(0.06,t2); g2.gain.exponentialRampToValueAtTime(0.001,t2+0.12);
    o.connect(g2); g2.connect(ac.destination); o.start(t2); o.stop(t2+0.14);
  }catch(e){}
}
function rideStart(kind){
  checkDay();
  if(s.daily[kind]){ toast(kind==='bike'?'🚲 今天已经骑过自行车了':'🛴 今天已经滑过滑板了'); return; }
  s.daily[kind]=true; saveData();
  if(kind==='bike') bikeBellSnd(); else skateSnd();
  render();
  ridePanel(kind);
}
function ridePanel(kind){
  clearRideTimers();
  rideKind=kind;
  var bike=(kind==='bike');
  var dur=10+Math.floor(Math.random()*6);       // 10~15 秒
  var total=dur*5;                              // 200ms 一跳
  var left=total;
  showPanel('<div style="text-align:center;font-size:40px">'+(bike?'🚲':'🛴')+'</div><h3>'+(bike?'短途骑行':'短途滑行')+'</h3>'+
    '<p id="rideLine" style="text-align:center;min-height:52px">'+RIDE_TEXT[kind].open+'…</p>'+
    '<div style="height:8px;background:#eee;border-radius:99px;overflow:hidden;margin:10px 0"><div id="rideBar" style="height:100%;width:0%;background:#f0b45c"></div></div>'+
    '<p id="rideTime" style="text-align:center;font-size:12px;color:#806f60">'+dur+' 秒</p>'+
    '<button class="opt" style="text-align:center;background:#e8ddd0" onclick="rideSkip()">跳过</button>');
  var shown=0;
  function tick(){
    var bar=document.getElementById('rideBar');
    var lineEl=document.getElementById('rideLine');
    var timeEl=document.getElementById('rideTime');
    if(!bar && !lineEl && !timeEl){ clearRideTimers(); return; }   // 面板被关掉了
    left--;
    var elapsed=(total-left)*0.2;
    if(bar) bar.style.width=Math.min(100,(total-left)/total*100).toFixed(1)+'%';
    if(timeEl) timeEl.textContent=Math.max(0,Math.ceil(left*0.2))+' 秒';
    if(lineEl && elapsed-shown>=2.4){ shown=elapsed; lineEl.textContent=pick(RIDE_LINES); }
    if(left<=0){ rideResult(kind); return; }
    rideTimers.push(setTimeout(tick,200));
  }
  rideTimers.push(setTimeout(tick,200));
}
function rideSkip(){ rideResult(rideKind||'bike'); }
function rideResult(kind){
  clearRideTimers();
  var bike=(kind==='bike');

// ======== 猫咪自发表情（互动计时器） ========
function catIdsPresent(){
  var out=[], all=['mainCat','v1Cat','v2Cat'];
  for(var i=0;i<all.length;i++){ if(document.getElementById(all[i])) out.push(all[i]); }
  return out;
}
function clearCatTimers(){for(var i=0;i<catTimers.length;i++)clearTimeout(catTimers[i]);catTimers=[]}
function stopCatTimers(){interactionRunning=false;interactionSig='';clearCatTimers()}
function addCatTimer(fn,ms){
  var t=setTimeout(function(){
    for(var i=0;i<catTimers.length;i++){ if(catTimers[i]===t){catTimers.splice(i,1);break} }
    fn();
  },ms);
  catTimers.push(t); return t;
}

function startInteractionTimer(force){
  var ids=catIdsPresent();
  var sig=scene+'|'+ids.join(',');
  if(!force && interactionRunning && sig===interactionSig) return;  // 场景没变就不打断已有循环
  clearCatTimers();
  interactionRunning=false; interactionSig=sig;
  if(scene==='outside' || isJankening || ids.length===0) return;
  interactionRunning=true;
  for(var i=0;i<ids.length;i++) scheduleCatAction(ids[i]);
}

function scheduleCatAction(catId){
  if(!interactionRunning || isJankening) return;
  var n=catIdsPresent().length;
  var base = n>=3 ? 5000 : (n===2 ? 3600 : 3000);
  var span = n>=3 ? 4000 : 3000;
  var delay = base + Math.random()*span;
  if(Math.random() < 0.3) delay += 1000 + Math.random()*1000;
  addCatTimer(function(){
    if(!interactionRunning || isJankening) return;
    triggerCatAction(catId);
  }, delay);
}

function triggerCatAction(catId){
  if(!interactionRunning || isJankening) return;
  if(!document.getElementById(catId)) return;
  var r = Math.random(), emoji = '';
  if (r < 0.85) emoji = pick(['😸', '😽', '😺']);
  else if (r < 0.95) emoji = pick(['😾', '😹', '😼']);
  else emoji = pick(['😻', '🙀']);

  showBubble(catId, emoji, 2500 + Math.random()*1000);

  var ids=catIdsPresent(), others=[];
  for(var i=0;i<ids.length;i++){ if(ids[i]!==catId) others.push(ids[i]); }
  if(['😾','😹','😼'].indexOf(emoji)>=0 && others.length>0){
    // 只有两只以上才会斗嘴猜拳；先让它们走到彼此旁边再开口
    isJankening = true;
    var other = pick(others);
    addCatTimer(function(){
      if(!isJankening) return;
      if(!document.getElementById(catId)){ isJankening=false; startInteractionTimer(true); return; }
      startJanken(catId, other);
    }, 1500);
  } else {
    scheduleCatAction(catId);
  }
}

function triggerJankenGame(id1, id2) {
  if(!document.getElementById(id1) || !document.getElementById(id2)) { isJankening=false; startInteractionTimer(true); return; }
  var hands = ['✌️','✊','🖐️'];
  var p1 = pick(hands), p2 = pick(hands);
  showBubble(id1, p1, 2000); showBubble(id2, p2, 2000);

  var win1 = false, win2 = false, draw = false;
  if(p1 === p2) draw = true;
  else if((p1 === '✌️' && p2 === '🖐️') || (p1 === '✊' && p2 === '✌️') || (p1 === '🖐️' && p2 === '✊')) win1 = true;
  else win2 = true;

  setTimeout(function() {
    if(!isJankening) return;
    var msg = "";
    if(win1) {
        if(id1 === 'mainCat') { s.mood = Math.min(100, s.mood + 1); msg = "主猫 (" + p1 + ") 赢了！<br>💖 心情 +1"; }
        else { s.mood = Math.max(0, s.mood - 1); msg = "访客猫 (" + p1 + ") 赢了！<br>💔 心情 -1"; }
    } else if (win2) {
        if(id2 === 'mainCat') { s.mood = Math.min(100, s.mood + 1); msg = "主猫 (" + p2 + ") 赢了！<br>💖 心情 +1"; }
        else { s.mood = Math.max(0, s.mood - 1); msg = "访客猫 (" + p2 + ") 赢了！<br>💔 心情 -1"; }
    } else {
        msg = "平局！<br>大家都出了 " + p1;
    }
    saveData();
    if(win1 || win2) jankenWinSnd();
    checkStar();
    showPanel('<div style="text-align:center;font-size:40px">✌️✊🖐️</div><h3>猜拳结果</h3><p style="text-align:center;font-size:16px;line-height:1.8">'+msg+'</p><button class="opt" style="text-align:center" onclick="endJanken()">确定</button>');
  }, 1500);
}

  if (window.catchBallY < 200) { window.catchBallY += window.catchBallSpeed; document.getElementById('catchBall').style.top = window.catchBallY + 'px'; requestAnimationFrame(catchLoop); }
  else { window.catchGameRunning = false; document.getElementById('catchBall').style.display = 'none'; toast('没接住...'); setTimeout(function(){closeM()},800); }
}
function catchHandClick(el) {
  if (!window.catchGameRunning) return; el.textContent = '🙏';
  if (window.catchBallY > 100 && window.catchBallY < 200) {
    window.catchGameRunning = false; if(document.getElementById('catchBall')) document.getElementById('catchBall').style.display='none';
    coinSnd(); var reward = Math.floor(Math.random()*3) + 3; s.mood=Math.min(100,s.mood+5); s.gold+=reward; saveData(); checkStar();

}

function startCatTick(){
  if(scene !== 'room' || catInBasket || !s.catName){
    if(window.tickTimer){ clearTimeout(window.tickTimer); window.tickTimer = null; }
    return;
  }
  if(window.tickTimer) return;
  window.tickTimer = setTimeout(function(){
    window.tickTimer = null;
    if(scene !== 'room' || catInBasket) return;
    var cat = document.getElementById('mainCat');
    if(cat) { var inner = cat.querySelector('.cat-anim'); if(inner && Math.random() < 0.6) { inner.classList.add('cat-hop'); setTimeout(function(){inner.classList.remove('cat-hop')}, 600); } }
    startCatTick();
  }, 3500 + Math.random() * 4000);
}

function goto(x){
  stopWander();
  clearBasketTimers();
  if(basketTimer){ clearTimeout(basketTimer); basketTimer=null; }
  if(x!=='room'){ catInBasket=false; stopPurr(); }
  scene=x;
  if(x==='outside') rollRidePositions();
  if(x==='yard' && s.daily && !s.daily.wx){
    s.daily.wx=true;
    if(wxNow==='sunny'){ s.mood=Math.min(100,s.mood+1); toast('☀️ 天气很好，猫咪心情 +1'); }
    else if(wxNow==='storm'){ s.mood=Math.max(0,s.mood-1); toast('⛈️ 打雷了，猫咪有点不安 -1'); }
    saveData();
  }

  v1Name=null; v1Pos=null;
  v2Name=null; v2Pos=null;

  if(x==='room'){
    mainPos=null;
    roomPos=pickSpot(ROOM_CAT_SPOTS, []);
    if(Math.random()<0.35){
      var others = Object.keys(CATS).filter(function(n){return n!==s.catName});
      v1Name = pick(others); v1Pos = pickSpot(ROOM_CAT_SPOTS, [roomPos]);
    }
  } else if(x==='yard'){
    roomPos=null;
    mainPos = pickSpot(YARD_CAT_SPOTS, []);
    var r = Math.random();
    if(r < 0.35) {
      var others2 = Object.keys(CATS).filter(function(n){return n!==s.catName});
      others2 = others2.sort(function(){return 0.5 - Math.random()});
      v1Name = others2[0];
      v1Pos = pickSpot(YARD_CAT_SPOTS, [mainPos]);
      if(r < 0.15) {
        v2Name = others2[1];
        v2Pos = pickSpot(YARD_CAT_SPOTS, [mainPos, v1Pos]);
      }
    }
  }

  render();
  if(x==='room'){
    if(Math.random()<0.3){
      catInBasket=true; render(); startPurr();
      basketTimers.push(setTimeout(wakeUp, 180000+Math.random()*180000));
    } else { scheduleBasketCheck(); }
  }
}

function scheduleBasketCheck(){
  if(basketTimer)clearTimeout(basketTimer);
  basketTimer=setTimeout(function(){
    basketTimer=null;
    if(scene!=='room'||!s.catName||catInBasket||walkingToBasket) return;
    if(document.getElementById('overlay').style.display==='flex'){ scheduleBasketCheck(); return; }
    // 待久了偶尔会自己走过去睡
    if(Math.random()<0.65){ walkToBasket(); } else { scheduleBasketCheck(); }
  },30000+Math.random()*25000);
}

// 猫咪自己慢慢走到篮子边，然后蜷进去睡
var BASKET_SPOT=[14,76];
var walkingToBasket=false;
var basketTimers=[];
function clearBasketTimers(){ for(var i=0;i<basketTimers.length;i++) clearTimeout(basketTimers[i]); basketTimers=[]; walkingToBasket=false; }
function walkToBasket(){
  if(scene!=='room'||catInBasket||!s.catName||walkingToBasket) return false;
  var el=document.getElementById('mainCat');
  if(!el) return false;
  walkingToBasket=true;
  stopWander();
  if(!roomPos) roomPos=[BASKET_SPOT[0],BASKET_SPOT[1]];
  var dur=3.6;
  el.style.transition='left '+dur+'s ease-in-out, top '+dur+'s ease-in-out';
  el.style.left=BASKET_SPOT[0]+'%'; el.style.top=BASKET_SPOT[1]+'%'; el.style.zIndex=catZ(BASKET_SPOT[1]);
  roomPos[0]=BASKET_SPOT[0]; roomPos[1]=BASKET_SPOT[1];
  basketTimers.push(setTimeout(function(){
    walkingToBasket=false;
    if(scene!=='room'||catInBasket) return;
    catInBasket=true;
    render();
    startPurr();
    toast('💤 猫咪自己走进篮子，蜷起来睡了');
    basketTimers.push(setTimeout(wakeUp, 240000+Math.random()*120000));
  }, dur*1000));
  return true;
}

function wakeUp(){
  if(scene!=='room'||!catInBasket) return;
  catInBasket=false;
  stopPurr();
  render();
  toast('🐾 猫咪睡醒了，伸了个懒腰');
  scheduleBasketCheck();
}

function wakeCat(){ if(catInBasket){ toast('💤 猫咪在篮子里睡得正香'); } else{ toast('🧺 空篮子'); } }

function pet() {
  initAudio(); if(!s.catName) return;
  if(Math.random() < 0.12) { rustle(); startCatchGame(); return; }
  meowSnd(s.catName); checkDay();
  var catX = (scene==='yard') ? mainPos[0] : (roomPos ? roomPos[0] : 50);
  var catY = (scene==='yard') ? mainPos[1] : (roomPos ? roomPos[1] : 58);
  var furn = nearFurniture(catX, catY);
  var line = (furn && FURN_PLAY[furn.key] && FURN_PLAY[furn.key][s.catName]) ? pick(FURN_PLAY[furn.key][s.catName]) : '';

  var first = s.daily.pet === false;
  if(first) { s.mood=Math.min(100,s.mood+8); s.daily.pet=true; saveData(); checkStar(); }
  if(furn) showBubble('mainCat', '🎠');
  if(first) toast('💖 +8' + (line ? '　' + line : ''));
  else if(line) toast(line);
  else toast(pick(CATS[s.catName].petTexts||['💕 蹭了蹭']));

  showFloatingEmoji(catX, catY, pick(['😻','😹','😸','😺','😽']));

function showFloatingEmoji(x, y, emoji) {

function feed(name){
  checkDay();
  if(s.daily.fed){ toast('喂过啦'); return; }
  var i=s.inventory.indexOf(name); if(i<0) return;
  var c=CATS[s.catName], v=6, msg='', emoji='😺';
  if(c.like.indexOf(name)>=0){ v=10; emoji='😻'; msg='⭐ 这是'+s.catName+'喜欢的东西！💖 +10'; }
  else if(c.dislike.indexOf(name)>=0){ v=-3; emoji='😿'; msg='❌ 它不太喜欢「'+name+'」……💔 -3'; }
  else { msg='💖 吃掉了「'+name+'」，+6'; }
  s.inventory.splice(i,1); s.daily.fed=true;
  s.mood=Math.max(0,Math.min(100,s.mood+v));
  saveData(); checkStar();
  showBubble('mainCat', emoji);
  toast(msg);
  render(); feedPanel();
}

function triggerFurnStory(key){
    var f=FURN[key], linesArr = f.lines[s.catName];
    var ev;
    var storyKey = key + '_' + s.catName;

    if (!s.furnStorySeen[storyKey]) {
        ev = linesArr[0];
        s.furnStorySeen[storyKey] = true;
        saveData();
    } else {
        ev = pick([linesArr[1], linesArr[2]]);
    }

function chooseTask(v,type){checkDay();if(type==='single')s.daily.single=true;if(type==='reward')s.daily.reward=true;var pv=parseVal(v),moodV=pv[0],goldV=pv[1],decay=(type==='job')?10:0;s.mood=Math.max(0,Math.min(100,s.mood+moodV-decay));var goldGain=goldV;if(type==='job')goldGain+=5;else if(type==='single')goldGain+=3;s.gold=Math.max(0,s.gold+goldGain);if(goldGain>0)coinSnd();saveData();checkStar();closeM();var msg='💖'+moodV;if(decay>0)msg+=' -'+decay;if(goldGain>0)msg+='　💰+'+goldGain;else if(goldGain<0)msg+='　💰'+goldGain;toast(msg);render()}

else setTimeout(function(){var F=checkFestival();if(F)showFestival(F);else checkOnline()},900);
